    <script>
        // Project data
        const projects = [
            {
                id: 1,
                title: 'Gift Wishlist App',
                description: 'A modern web application for creating and sharing gift wishlists with your friends and family. Built with React, TypeScript, and Firebase.',
                image: './images/gift-wishlist.png',
                url: 'https://gift-list-8868b.web.app/login',
                repo: 'https://github.com/KaileyHart/GiftList',
            },
            {
                id: 2,
                title: 'Activity Challenge',
                description: 'A cross-browser mobile application that uses React Native, Firebase, and the BoredAPI to help users find something to do when they are bored, when they want to try something new, or they cannot decide what to do.',
                image: './images/activity-challenge.jpg',
                url: 'https://theactivitychallenge.web.app',
                repo: 'https://github.com/KaileyHart/TheActivityChallenge'
            },
            {
                id: 3,
                title: 'React Spotify Clone',
                description: 'A responsive React App that replicates the Spotify Web App UI and some functionalities, such as play and skip.',
                image: './images/spotify-clone.png',
                url: 'https://spotify-react-web-app.web.app/',
                repo: 'https://github.com/KaileyHart/React-Spotify-Clone'
            },
            {
                id: 4,
                title: 'StravaConnect Dashboard',
                description: 'A web app dashboard that connects to the Strava API to display a user\'s Strava activities, statistics, and profile information.',
                image: './images/laptop.jpg',
                url: '',
                repo: 'https://github.com/KaileyHart/StravaConnect'
            },
        ];

        // Skills data
        const skills = [
            'React', 'JavaScript', 'TypeScript', 'Express', 'APIs', 'Apex',
            'SQL', 'Firebase', 'Github', 'Salesforce CRM',
            'Lightning Web Components', 'Salesforce Marketing Cloud'
        ];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function () {
            renderProjects();
            renderSkills();
            initScrollAnimations();
        });

        // Render projects
        function renderProjects() {
            const projectsGrid = document.getElementById('projects-grid');

            projects.forEach((project, index) => {
                const projectCard = document.createElement('div');
                projectCard.className = 'project-card animate-on-scroll';
                projectCard.style.transitionDelay = `${index * 0.1}s`;

                projectCard.innerHTML = `
                    <img src="${project.image}" alt="${project.title}" class="project-image">
                    <div class="project-overlay"></div>
                    <div class="project-content">
                        <h3 class="project-title">${project.title}</h3>
                        <p class="project-description">${project.description}</p>
                        <div class="project-links">
                            <a href="${project.url}" target="_blank" rel="noopener noreferrer" class="project-link project-link-primary">
                                View Project
                            </a>
                            <a href="${project.repo}" target="_blank" rel="noopener noreferrer" class="project-link project-link-secondary">
                                GitHub
                            </a>
                        </div>
                    </div>
                `;

                projectsGrid.appendChild(projectCard);
            });
        }

        // Render skills
        function renderSkills() {
            const skillsGrid = document.getElementById('skills-grid');

            skills.forEach((skill, index) => {
                const skillCard = document.createElement('div');
                skillCard.className = 'skill-card animate-on-scroll';
                skillCard.style.transitionDelay = `${index * 0.1}s`;

                skillCard.innerHTML = `
                    <h3 class="skill-name">${skill}</h3>
                `;

                skillsGrid.appendChild(skillCard);
            });
        }

        // Initialize scroll animations
        function initScrollAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate');
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            });

            // Observe all elements with animate-on-scroll class
            document.querySelectorAll('.animate-on-scroll').forEach(el => {
                observer.observe(el);
            });
        }

        // Smooth scroll for any internal links (if added later)
        document.addEventListener('click', function (e) {
            if (e.target.tagName === 'A' && e.target.getAttribute('href').startsWith('#')) {
                e.preventDefault();
                const targetId = e.target.getAttribute('href').substring(1);
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth' });
                }
            }
        });
    </script>
